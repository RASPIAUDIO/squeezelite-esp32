<template id="sendspin-system-template">
<section class="card mb-3" id="sendspin-system-card" aria-labelledby="ss-heading">
<div class="card-header" id="ss-heading">Sendspin</div><div class="card-body">
<p class="text-muted small">Play music from Music Assistant or another Sendspin server.</p>
<form id="ss-form">
<div id="ss-service"><div class="form-check"><input class="form-check-input" id="ss-enabled" form="ss-form" longopts="undefined" shortopts="undefined" type="checkbox" disabled aria-controls="ss-options" aria-expanded="false"><label class="form-check-label" for="ss-enabled">Enable Sendspin</label></div><small class="form-text text-muted" id="ss-service-message" role="status">More options in Sendspin below.</small></div>
<div id="ss-options" hidden><div class="form-group mb-3"><label for="ss-name">Player name</label><input class="form-control" id="ss-name" type="text" maxlength="63" autocomplete="off" disabled></div></div>
<p class="small text-muted">Save stores your settings. Apply saves and restarts the player, interrupting playback. Existing pairings are preserved.</p>
<button type="submit" class="btn btn-info" id="ss-save" disabled>Save</button>
<button type="button" class="btn btn-warning" id="ss-apply" disabled>Apply</button></form>
<p id="ss-message" class="mt-3 mb-0" role="status" aria-live="polite"></p>
<hr><h6>Connection</h6><dl class="row mb-0">
<dt class="col-sm-4">Status</dt><dd class="col-sm-8" id="ss-state">Checking...</dd>
<dt class="col-sm-4">Server</dt><dd class="col-sm-8 text-break" id="ss-server">—</dd>
<dt class="col-sm-4">Audio stream</dt><dd class="col-sm-8" id="ss-stream">—</dd>
<dt class="col-sm-4">Track</dt><dd class="col-sm-8 text-break" id="ss-title">—</dd>
<dt class="col-sm-4">Clock synchronized</dt><dd class="col-sm-8" id="ss-sync">—</dd>
<dt class="col-sm-4">Paired servers</dt><dd class="col-sm-8" id="ss-pairings">—</dd></dl>
<div id="ss-pairing" hidden><hr><h6>Pairing</h6>
<p class="small text-muted">Add this player in Music Assistant. If asked for a pairing token, reveal it here and paste it into Music Assistant.</p>
<button type="button" class="btn btn-secondary btn-sm" id="ss-reveal" disabled>Show pairing token</button>
<button type="button" class="btn btn-secondary btn-sm" id="ss-hide" hidden>Hide token</button>
<div id="ss-token-area" class="mt-3" hidden><label for="ss-token">Pairing token — keep private</label>
<textarea class="form-control" id="ss-token" rows="3" readonly spellcheck="false"></textarea>
<small class="text-muted">Select the text to copy it. It is hidden after one minute or when you leave this tab.</small></div>
<details class="mt-3"><summary>Reset pairing</summary><p class="small text-muted mt-2">Forget all paired servers and replace the pairing token. You will need to pair Music Assistant again. The player will restart.</p>
<button type="button" class="btn btn-danger btn-sm" id="ss-forget" disabled>Forget pairings and restart</button></details>
</div></div></section></template>
